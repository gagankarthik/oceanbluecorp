version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "NEXT_AWS_ACCESS_KEY_ID=$NEXT_AWS_ACCESS_KEY_ID" >> .env.production
        - echo "NEXT_AWS_SECRET_ACCESS_KEY=$NEXT_AWS_SECRET_ACCESS_KEY" >> .env.production
        - echo "NEXT_PUBLIC_AWS_REGION=$NEXT_PUBLIC_AWS_REGION" >> .env.production
        - echo "NEXT_AWS_S3_BUCKET_NAME=$NEXT_AWS_S3_BUCKET_NAME" >> .env.production
        - echo "NEXT_AWS_S3_BUCKET_REGION=$NEXT_AWS_S3_BUCKET_REGION" >> .env.production
        - echo "NEXT_AWS_DYNAMODB_TABLE_RESUMES=$NEXT_AWS_DYNAMODB_TABLE_RESUMES" >> .env.production
        - echo "NEXT_AWS_DYNAMODB_TABLE_APPLICATIONS=$NEXT_AWS_DYNAMODB_TABLE_APPLICATIONS" >> .env.production
        - echo "NEXT_AWS_DYNAMODB_TABLE_JOBS=$NEXT_AWS_DYNAMODB_TABLE_JOBS" >> .env.production
        - echo "NEXT_AWS_DYNAMODB_TABLE_CONTACTS=$NEXT_AWS_DYNAMODB_TABLE_CONTACTS" >> .env.production
        - echo "NEXT_AWS_DYNAMODB_TABLE_CANDIDATES=$NEXT_AWS_DYNAMODB_TABLE_CANDIDATES" >> .env.production
        - echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID" >> .env.production
        - echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID" >> .env.production
        - echo "NEXT_PUBLIC_COGNITO_DOMAIN=$NEXT_PUBLIC_COGNITO_DOMAIN" >> .env.production
        - echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env.production
        - echo "NEXT_AWS_SES_FROM_EMAIL=$NEXT_AWS_SES_FROM_EMAIL" >> .env.production
        - echo "NEXT_AWS_STMP=$NEXT_AWS_STMP" >> .env.production
        - echo "NEXT_AWS_STMP_PASSWORD=$NEXT_AWS_STMP_PASSWORD" >> .env.production
        - echo "NEXT_AWS_STMP_IAM_USERNAME=$NEXT_AWS_STMP_IAM_USERNAME" >> .env.production
        - echo "NEXT_AWS_DYNAMODB_TABLE_API_KEYS=$NEXT_AWS_DYNAMODB_TABLE_API_KEYS" >> .env.production
        # Submissions / interviews / placements (scripts/create-pipeline-table.mjs)
        - echo "NEXT_AWS_DYNAMODB_TABLE_PIPELINE=$NEXT_AWS_DYNAMODB_TABLE_PIPELINE" >> .env.production
        # Resume Matching Engine (server-side only; set both in Amplify env vars)
        - echo "RESUME_MATCH_API_URL=$RESUME_MATCH_API_URL" >> .env.production
        - echo "RESUME_MATCH_API_KEY=$RESUME_MATCH_API_KEY" >> .env.production
        # Resume extraction engine. POST /extract needs an X-Extraction-Token
        # ticket, signed per request with the secret below — it must match
        # EXTRACTION_SHARED_SECRET on the engine, or every analysis fails 401
        # "Upload authorisation failed or expired."
        - echo "NEXT_PUBLIC_RESUME_PARSER_API_URL=$NEXT_PUBLIC_RESUME_PARSER_API_URL" >> .env.production
        - echo "NEXT_EXTRACTION_SHARED_SECRET=$NEXT_EXTRACTION_SHARED_SECRET" >> .env.production

        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
